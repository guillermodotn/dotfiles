# INFO: Installation command
# dotbot -c install.conf.yaml

- defaults:
    link:
      relink: true
      create: true

- clean: ["~"]

- link:
    #### Neovim ####
    ~/.config/nvim/init.lua: nvim/init.lua
    ~/.config/nvim/lua: nvim/lua

    #### Bash ####
    ~/.bashrc: .bashrc
    ~/.inputrc: .inputrc
    ~/.bashrc.d/aliases.sh: bashrc.d/aliases.sh
    ~/.bashrc.d/history.sh: bashrc.d/history.sh

    #### Tools ####
    ~/.config/mpv: mpv
    ~/.config/git: git

    #### Opencode ####
    ~/.config/opencode: opencode

- create:
    - ~/.bashrc.d

- shell:
    - command: test -f ~/.bashrc.d/_env-vars.sh || cp bashrc.d/env-vars.sh ~/.bashrc.d/_env-vars.sh
      description: Copying env-vars.sh if not present (not linked — contains secrets)
      quiet: true
