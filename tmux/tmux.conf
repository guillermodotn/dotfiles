# ------------------------------------------------------------
# Earthsong theme
# ------------------------------------------------------------
# source-file ~/.config/tmux/earthsong.tmux

# ------------------------------------------------------------
# Sensible defaults (replaces tmux-sensible plugin)
# ------------------------------------------------------------
set -g escape-time 10           # Fast escape (was tmux-sensible: 0)
set -g focus-events on

# ------------------------------------------------------------
# Indexing & Window Management
# ------------------------------------------------------------
set -g base-index 1             # Window numbering from 1
setw -g pane-base-index 1       # Pane numbering from 1
set-option -g renumber-windows on

# ------------------------------------------------------------
# Mouse & History
# ------------------------------------------------------------
set -g mouse on
set -g history-limit 10000

# ------------------------------------------------------------
# Clipboard
# ------------------------------------------------------------
set -s copy-command 'wl-copy -n'

# ------------------------------------------------------------
# Key bindings
# ------------------------------------------------------------
set-window-option -g mode-keys vi  # Vi-style copy mode

# Vim-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation (prefix + H/L)
bind H previous-window
bind L next-window
